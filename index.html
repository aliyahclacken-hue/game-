<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bubble Wheel Arcade</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#071326;color:#fff;font-family:Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}
#title{margin:0 0 8px;font-size:clamp(28px,8vw,48px)}
#mode{font-size:clamp(22px,6vw,34px);font-weight:700;margin:8px 0}
#status{font-size:clamp(18px,5vw,26px);min-height:3em;max-width:700px;line-height:1.25}
#score{font-size:clamp(18px,5vw,28px);font-weight:700;margin-top:8px}
#wheel{width:min(62vw,330px);aspect-ratio:1;border:10px solid #fff;border-radius:50%;display:grid;place-items:center;margin:12px;background:conic-gradient(#ff5f6d 0 36deg,#ffc371 36deg 72deg,#49dcb1 72deg 108deg,#4e9cff 108deg 144deg,#a66cff 144deg 180deg,#ff72c6 180deg 216deg,#48d1cc 216deg 252deg,#f5a623 252deg 288deg,#7ed321 288deg 324deg,#d66cff 324deg 360deg);box-shadow:0 0 32px rgba(255,255,255,.25);transition:transform 4.8s cubic-bezier(.12,.72,.18,1)}
#wheel span{background:#071326;border:5px solid #fff;border-radius:50%;width:44%;aspect-ratio:1;display:grid;place-items:center;font-weight:800;font-size:clamp(18px,5vw,26px)}
#playfield{position:absolute;inset:0;display:none}
.zone{position:absolute;top:0;bottom:0;width:33.333%;border:0;background:transparent;color:transparent}
#leftZone{left:0}#centreZone{left:33.333%}#rightZone{right:0}
#bubbleVisual{position:absolute;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,rgba(104,220,255,.9) 18%,rgba(91,131,255,.35) 58%,rgba(255,255,255,.15));border:3px solid rgba(255,255,255,.85);box-shadow:0 0 24px rgba(119,226,255,.85);transform:translate(-50%,-50%);pointer-events:none}
#controls{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
#controls button,#startButton,#exitButton{min-height:58px;border:3px solid #fff;border-radius:14px;background:#174ea6;color:#fff;font-size:20px;font-weight:700;padding:10px 16px}
#controls button{flex:1}
#exitButton{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));background:#8b1e2d;display:none;z-index:10}
#startButton{margin-top:18px;width:min(92vw,420px)}
#instructions{max-width:700px;font-size:17px;line-height:1.35;margin-top:8px}
.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{transform:scale(.8)}60%{transform:scale(1.13)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
  <button id="exitButton" type="button">Exit game</button>
  <h1 id="title">Bubble Wheel Arcade</h1>
  <div id="wheel"><span>DOUBLE TAP</span></div>
  <div id="mode">Wheel hub</div>
  <div id="status">Press Start once, then double tap the middle of the screen to spin.</div>
  <div id="score"></div>
  <button id="startButton" type="button">Start sound</button>
  <div id="instructions">Left or right side: move. Centre: pop. Double tap: jump. Double tap and hold: charge a jump. Two-finger tap: scanner.</div>
  <div id="playfield">
    <button class="zone" id="leftZone" aria-label="Move left"></button>
    <button class="zone" id="centreZone" aria-label="Pop or jump"></button>
    <button class="zone" id="rightZone" aria-label="Move right"></button>
    <div id="bubbleVisual" hidden></div>
  </div>
  <div id="controls" hidden>
    <button id="scanButton" type="button">Scanner</button>
    <button id="homeButton" type="button">Wheel hub</button>
  </div>
</div>
<script>
'use strict';
const files={
 pop:'universfield-bubble-pop-293342.mp3',
 music:'ncone-soft-piano-loop-192098.mp3',
 wheel:'wheel-spin.mp3',
 jump:'bestuploadsever67aryan-jump-sound-531048.mp3',
 walk:'freesoundsxx-walking-on-concrete-ver-2-268513.mp3',
 door:'soundreality-open-and-closed-door-reverb-206833.mp3',
 cash:'dragon-studio-cash-register-kaching-376867.mp3',
 beep:'cartoon-music-game-sfx-cash-register-scanner-single-beep-494483.mp3'
};
const modes=[
 {id:'timing',name:'Fastest Beep',instruction:'Tap the screen when the beeps are at their fastest.'},
 {id:'rush',name:'Bubble Rush',instruction:'Pop as many bubbles as you can before time runs out.'},
 {id:'jump',name:'High Jump',instruction:'Double tap and hold the second tap, then release to jump as high as you can.'},
 {id:'relax',name:'Relaxed Bubbles',instruction:'Pop bubbles at your own pace. There is no timer.'},
 {id:'hunt',name:'Bubble Hunt',instruction:'Use the scanner to find and pop ten bubbles.'},
 {id:'coins',name:'Coin Chase',instruction:'Pop fifteen bubbles and find the hidden coins.'},
 {id:'memory',name:'Bubble Memory',instruction:'Listen to the left, centre and right beeps, then tap the same pattern.'},
 {id:'streak',name:'Bubble Streak',instruction:'Pop bubbles without missing. Build the longest streak you can.'},
 {id:'lucky',name:'Lucky Bubble',instruction:'Pop bubbles until you find the hidden lucky bubble.'},
 {id:'direction',name:'Direction Dash',instruction:'Listen for a left, centre or right beep, then tap that side quickly.'}
];
const el=id=>document.getElementById(id);
const wheel=el('wheel'),modeText=el('mode'),statusText=el('status'),scoreText=el('score'),startButton=el('startButton'),playfield=el('playfield'),bubbleVisual=el('bubbleVisual'),controls=el('controls'),exitButton=el('exitButton');
let ctx,buffers={},music,currentMode='hub',busy=false,score=0,target=null,timer=null,roundEnd=0,beepTimer=null,position=1,chargeStart=0,lastTap=0,pendingTap=null,popCount=0,goal=0;
let selectedMode=null,speechFallback=null,lastTwoFingerTap=0,speechUnlocked=false,walkSource=null;
let memorySequence=[],memoryInput=[],memoryRound=0,directionTarget=1,directionRound=0,streak=0,bestStreak=0,misses=0,luckyIndex=0;
async function initAudio(){
 if(ctx){await ctx.resume();return}
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 await ctx.resume();
 for(const [key,url] of Object.entries(files)){
   try{const r=await fetch(url);buffers[key]=await ctx.decodeAudioData(await r.arrayBuffer())}catch(e){console.error('Could not load',url,e)}
 }
 music=new Audio(files.music);music.loop=true;music.volume=.18;music.play().catch(()=>{});
 if(Object.keys(buffers).length===0){
   statusText.textContent='No sound files loaded. Put index.html and all MP3 files in the same folder.';
   return;
 }
 if(!speechUnlocked)statusText.textContent='Sounds loaded.';
}
function play(name,{pan=0,rate=1,volume=1,loop=false}={}){
 if(!ctx||!buffers[name])return null;
 const s=ctx.createBufferSource(),g=ctx.createGain(),p=ctx.createStereoPanner();
 s.buffer=buffers[name];s.playbackRate.value=rate;s.loop=loop;g.gain.value=volume;p.pan.value=Math.max(-1,Math.min(1,pan));
 s.connect(g).connect(p).connect(ctx.destination);s.start();return s;
}
function playWalk(pan){
 if(walkSource){try{walkSource.stop()}catch(e){} walkSource=null;}
 walkSource=play('walk',{pan,volume:.55,rate:1.2});
 if(walkSource)walkSource.onended=()=>{walkSource=null};
}
function vibrate(pattern){if(navigator.vibrate)navigator.vibrate(pattern)}
function later(ms,fn){return setTimeout(()=>{if(ctx)fn()},ms)}
function getPreferredVoice(){
 const voices=speechSynthesis.getVoices();
 return voices.find(v=>/Samantha/i.test(v.name))||
        voices.find(v=>/Serena|Martha|Moira|Karen|Tessa/i.test(v.name))||
        voices.find(v=>v.lang==='en-GB')||
        voices.find(v=>v.lang.startsWith('en'))||null;
}
function speakSelectedGame(m,after){
 selectedMode=m;
 clearTimeout(speechFallback);
 if(!('speechSynthesis' in window)){
   after();
   return;
 }
 speechSynthesis.cancel();
 if(typeof speechSynthesis.resume==='function')speechSynthesis.resume();
 const utterance=new SpeechSynthesisUtterance(`${m.name}. ${m.instruction} Go!`);
 utterance.lang='en-GB';
 utterance.rate=.92;
 utterance.pitch=1.05;
 utterance.volume=1;
 const voice=getPreferredVoice();
 if(voice)utterance.voice=voice;
 let finished=false;
 const finish=()=>{
   if(finished)return;
   finished=true;
   clearTimeout(speechFallback);
   after();
 };
 utterance.onend=finish;
 utterance.onerror=finish;
 speechSynthesis.speak(utterance);
 speechFallback=setTimeout(finish,9000);
}
function repeatInstructions(){
 if(!selectedMode||currentMode==='hub'||busy)return;
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(`${selectedMode.name}. ${selectedMode.instruction}`);
 utterance.lang='en-GB';
 utterance.rate=.92;
 utterance.pitch=1.05;
 const voice=getPreferredVoice();
 if(voice)utterance.voice=voice;
 speechSynthesis.speak(utterance);
}

function modeSignal(id){
 // Each game has a learnable non-speech sound signature.
 if(id==='timing'){
   later(0,()=>play('beep',{rate:.75,volume:.8}));
   later(420,()=>play('beep',{rate:1.05,volume:.8}));
   later(680,()=>play('beep',{rate:1.45,volume:.9}));
   return 1150;
 }
 if(id==='rush'){
   later(0,()=>play('pop',{pan:-.6,volume:.9}));
   later(180,()=>play('pop',{pan:0,volume:.9}));
   later(360,()=>play('pop',{pan:.6,volume:.9}));
   return 850;
 }
 if(id==='jump'){
   later(0,()=>play('jump',{rate:.85,volume:.85}));
   later(420,()=>play('jump',{rate:1.25,volume:.9}));
   return 1000;
 }
 if(id==='relax'){
   later(0,()=>play('pop',{volume:.75}));
   later(550,()=>play('pop',{volume:.75}));
   return 1050;
 }
 if(id==='hunt'){
   later(0,()=>play('beep',{pan:-.85,rate:1,volume:.8}));
   later(300,()=>play('beep',{pan:0,rate:1,volume:.8}));
   later(600,()=>play('beep',{pan:.85,rate:1,volume:.8}));
   return 1100;
 }
 if(id==='coins'){later(0,()=>play('pop',{volume:.8}));later(260,()=>play('cash',{volume:.9}));return 1000;}
 if(id==='memory'){later(0,()=>play('beep',{pan:-.8}));later(300,()=>play('beep',{pan:0}));later(600,()=>play('beep',{pan:.8}));return 1100;}
 if(id==='streak'){later(0,()=>play('pop'));later(180,()=>play('pop'));later(360,()=>play('pop'));later(540,()=>play('cash',{volume:.7}));return 1150;}
 if(id==='lucky'){later(0,()=>play('pop'));later(350,()=>play('cash'));return 1000;}
 if(id==='direction'){later(0,()=>play('beep',{pan:-.9}));later(300,()=>play('beep',{pan:.9}));return 950;}
 return 500;
}
function unlockSpeech(){
 if(!('speechSynthesis' in window)){
   statusText.textContent='Sound is ready, but browser speech is not available in this browser.';
   return;
 }
 speechSynthesis.cancel();
 const speakNow=()=>{
   const u=new SpeechSynthesisUtterance('Game ready.');
   u.lang='en-GB';u.rate=.95;u.pitch=1.05;u.volume=1;
   const voice=getPreferredVoice();if(voice)u.voice=voice;
   u.onend=()=>{speechUnlocked=true;statusText.textContent='Ready. Double tap the middle to spin the wheel.';};
   u.onerror=()=>{speechUnlocked=false;statusText.textContent='Browser voice could not start. Check that your phone is not in silent mode, then press Start sound again.';};
   speechSynthesis.speak(u);
   setTimeout(()=>{if(speechSynthesis.paused)speechSynthesis.resume()},120);
 };
 speakNow();
}
startButton.addEventListener('pointerup',e=>{
 e.preventDefault();e.stopPropagation();
 unlockSpeech();
 initAudio().then(()=>{
   startButton.hidden=true;
   if(!speechUnlocked)statusText.textContent='Sounds loaded. Double tap the middle to spin. Press Start sound again if you did not hear Game ready.';
 });
},{passive:false});
function hub(){
 clearTimers();clearTimeout(speechFallback);if('speechSynthesis' in window)speechSynthesis.cancel();currentMode='hub';busy=false;target=null;selectedMode=null;score=0;position=1;
 playfield.style.display='none';controls.hidden=true;exitButton.style.display='none';wheel.style.display='grid';
 modeText.textContent='Wheel hub';statusText.textContent='Double tap the middle of the screen to spin.';scoreText.textContent='';bubbleVisual.hidden=true;
}
function clearTimers(){clearTimeout(timer);clearTimeout(beepTimer);timer=null;beepTimer=null}
function spin(){
 if(currentMode!=='hub'||busy||!ctx)return;busy=true;play('wheel',{volume:.9});
 const pick=Math.floor(Math.random()*modes.length);const turns=5+pick/6;
 wheel.style.transform=`rotate(${turns*360}deg)`;statusText.textContent='Wheel spinning';
 setTimeout(()=>{
   const m=modes[pick];
   selectedMode=m;
   modeText.textContent=m.name;
   statusText.textContent=m.name+'. '+m.instruction;
   play('door',{volume:.7});
   speakSelectedGame(m,()=>startMode(m.id));
 },5100);
}
function startMode(id){
 clearTimers();currentMode=id;busy=false;score=0;popCount=0;position=1;
 wheel.style.display='none';playfield.style.display='block';controls.hidden=false;exitButton.style.display='block';scoreText.textContent='Score: 0';
 if(id==='timing')startTiming();
 if(id==='rush')startRush();
 if(id==='jump')startJump();
 if(id==='relax')startRelax();
 if(id==='hunt')startHunt();
 if(id==='coins')startCoins();
 if(id==='memory')startMemory();
 if(id==='streak')startStreak();
 if(id==='lucky')startLucky();
 if(id==='direction')startDirection();
}
function complete(message){
 clearTimers();target=null;bubbleVisual.hidden=true;statusText.textContent=message;play('door',{volume:.8});vibrate([80,40,120]);
 setTimeout(hub,2600);
}
function panFor(x){return x===0?-.82:x===2?.82:0}
function showTarget(){
 if(!target){bubbleVisual.hidden=true;return}
 bubbleVisual.hidden=false;bubbleVisual.style.left=(target.x===0?'18%':target.x===1?'50%':'82%');bubbleVisual.style.top=target.high?'28%':'56%';
 bubbleVisual.classList.remove('pulse');void bubbleVisual.offsetWidth;bubbleVisual.classList.add('pulse');
}
function makeBubble({coin=false}={}){
 target={x:Math.floor(Math.random()*3),high:Math.random()<.42,coin};showTarget();announceBubble();
}
function announceBubble(){
 if(!target)return;
 const distance=Math.abs(target.x-position);const pan=panFor(target.x);const rate=(target.high?1.38:.9)+(distance===0?.1:0);
 play('beep',{pan,rate,volume:distance===0?.8:.55});
}
function scheduleBubblePing(){
 clearTimeout(beepTimer);if(!target)return;
 announceBubble();beepTimer=setTimeout(scheduleBubblePing,1100);
}
function move(dir){
 if(!target||currentMode==='timing'||currentMode==='jump')return;
 position=Math.max(0,Math.min(2,position+dir));playWalk(panFor(position));
 setTimeout(announceBubble,180);
}
function attemptPop(jumping=false){
 if(!target)return;
 if(position!==target.x){play('beep',{pan:panFor(target.x),rate:.65,volume:.45});vibrate(35);if(currentMode==='streak'){streak=0;misses++;scoreText.textContent='Streak: 0. Best: '+bestStreak;statusText.textContent='Missed. Start a new streak.';}return}
 if(target.high&&!jumping){play('jump',{volume:.28,rate:.7});vibrate([35,30,35]);if(currentMode==='streak'){streak=0;misses++;scoreText.textContent='Streak: 0. Best: '+bestStreak;statusText.textContent='That bubble was high. Your streak resets.';}return}
 if(jumping)play('jump',{volume:.65,rate:1.05});
 const targetWasLucky=!!target.coin;
 play('pop',{pan:panFor(target.x),volume:.95});if(target.coin)play('cash',{volume:.9});
 score+=target.coin?5:1;popCount++;scoreText.textContent='Score: '+score;target=null;bubbleVisual.hidden=true;clearTimeout(beepTimer);
 handleAfterPop(targetWasLucky);
}
function handleAfterPop(targetWasLucky=false){
 if(currentMode==='rush'){setTimeout(()=>{makeBubble();scheduleBubblePing()},220)}
 if(currentMode==='relax'){setTimeout(()=>{makeBubble({coin:Math.random()<.15});scheduleBubblePing()},350)}
 if(currentMode==='hunt'){
   if(popCount>=goal)complete('Bubble hunt complete. Score '+score+'.');
   else setTimeout(()=>{makeBubble();scheduleBubblePing();statusText.textContent=`Bubble ${popCount+1} of ${goal}`},420)
 }
 if(currentMode==='coins'){
   if(popCount>=goal)complete('Coin chase complete. Score '+score+'.');
   else setTimeout(()=>{makeBubble({coin:Math.random()<.35});scheduleBubblePing();statusText.textContent=`Bubble ${popCount+1} of ${goal}`},350)
 }
 if(currentMode==='streak'){
   streak++;bestStreak=Math.max(bestStreak,streak);scoreText.textContent='Streak: '+streak+'. Best: '+bestStreak;
   if(popCount>=20)complete('Bubble streak complete. Best streak '+bestStreak+'.');
   else setTimeout(()=>{makeBubble();scheduleBubblePing();statusText.textContent='Keep the streak going.'},300)
 }
 if(currentMode==='lucky'){
   if(targetWasLucky){complete('You found the lucky bubble after '+popCount+' pops.');}
   else setTimeout(()=>{makeBubble({coin:popCount+1===luckyIndex});scheduleBubblePing();statusText.textContent='Keep searching for the lucky bubble.'},320)
 }
}
function startRush(){
 modeText.textContent='Bubble Rush';statusText.textContent='Pop as many as possible in 30 seconds.';roundEnd=Date.now()+30000;makeBubble();scheduleBubblePing();
 const tick=()=>{const left=Math.max(0,Math.ceil((roundEnd-Date.now())/1000));statusText.textContent=left+' seconds remaining';if(left<=0)complete('Time is up. Score '+score+'.');else timer=setTimeout(tick,500)};tick();
}
function startRelax(){modeText.textContent='Relaxed Bubbles';statusText.textContent='No timer. Pop bubbles for as long as you like.';makeBubble({coin:Math.random()<.15});scheduleBubblePing()}
function startHunt(){goal=10;modeText.textContent='Bubble Hunt';statusText.textContent='Find and pop 10 bubbles.';makeBubble();scheduleBubblePing()}
function startCoins(){goal=15;modeText.textContent='Coin Chase';statusText.textContent='Pop 15 bubbles. Some contain coins.';makeBubble({coin:Math.random()<.35});scheduleBubblePing()}
function startTiming(){
 modeText.textContent='Fastest Beep';statusText.textContent='Tap once when the beeps are at their fastest.';scoreText.textContent='';
 let step=0,total=18,start=Date.now()+700;
 const next=()=>{
   if(currentMode!=='timing')return;
   const progress=step/(total-1);play('beep',{rate:.75+progress*.9,volume:.65});
   step++;if(step<total){beepTimer=setTimeout(next,Math.max(90,650-step*31))}else{setTimeout(()=>{if(currentMode==='timing')complete('You waited too long. Try again from the wheel.')},700)}
 };
 target={timing:true,start,total,get step(){return step}};setTimeout(next,700);
}
function timingTap(){
 if(currentMode!=='timing'||!target)return;
 const step=target.step;const distance=Math.abs(17-step);score=Math.max(0,100-distance*9);scoreText.textContent='Score: '+score;
 if(distance<=1)play('cash',{volume:1});else play('pop',{volume:.8});complete('Timing score '+score+'.');
}
function startJump(){modeText.textContent='High Jump';statusText.textContent='Double tap and hold the second tap. Release to jump.';scoreText.textContent='Best height: 0';target={jump:true}}
function finishChargedJump(){
 if(currentMode!=='jump'||!chargeStart)return;
 const held=Math.min(3000,Date.now()-chargeStart);chargeStart=0;const height=Math.round((held/3000)*100);
 play('jump',{rate:.8+height/180,volume:.85});score=Math.max(score,height);scoreText.textContent='Best height: '+score;
 if(height>=90){play('cash',{volume:.85});setTimeout(()=>complete('Amazing jump. Height '+height+'.'),700)}else statusText.textContent='Height '+height+'. Double tap and hold to try again.';
}
function startStreak(){goal=20;streak=0;bestStreak=0;misses=0;modeText.textContent='Bubble Streak';statusText.textContent='Pop 20 bubbles. A miss resets your streak.';scoreText.textContent='Streak: 0. Best: 0';makeBubble();scheduleBubblePing()}
function startLucky(){luckyIndex=2+Math.floor(Math.random()*9);modeText.textContent='Lucky Bubble';statusText.textContent='Find the hidden lucky bubble.';scoreText.textContent='Bubbles popped: 0';makeBubble({coin:popCount+1===luckyIndex});scheduleBubblePing()}
function playMemorySequence(){
 busy=true;memoryInput=[];statusText.textContent='Listen to the pattern.';
 memorySequence.forEach((side,i)=>setTimeout(()=>play('beep',{pan:panFor(side),rate:1,volume:.85}),500+i*650));
 setTimeout(()=>{busy=false;statusText.textContent='Now tap the same pattern.'},500+memorySequence.length*650);
}
function startMemory(){memoryRound=1;memorySequence=[Math.floor(Math.random()*3),Math.floor(Math.random()*3),Math.floor(Math.random()*3)];modeText.textContent='Bubble Memory';scoreText.textContent='Round: 1 of 4';setTimeout(playMemorySequence,500)}
function memoryTap(side){
 if(busy)return;memoryInput.push(side);const i=memoryInput.length-1;
 if(side!==memorySequence[i]){play('beep',{rate:.55,volume:.8});complete('That was not the pattern. You reached round '+memoryRound+'.');return;}
 play('pop',{pan:panFor(side),volume:.65});
 if(memoryInput.length===memorySequence.length){
   play('cash',{volume:.8});memoryRound++;
   if(memoryRound>4){complete('Bubble memory complete. All four rounds correct.');return;}
   memorySequence.push(Math.floor(Math.random()*3));scoreText.textContent='Round: '+memoryRound+' of 4';setTimeout(playMemorySequence,900);
 }
}
function cueDirection(){directionTarget=Math.floor(Math.random()*3);statusText.textContent='Tap the side you hear.';play('beep',{pan:panFor(directionTarget),rate:1.05,volume:.9})}
function startDirection(){directionRound=0;score=0;modeText.textContent='Direction Dash';scoreText.textContent='Correct: 0 of 10';setTimeout(cueDirection,500)}
function directionTap(side){
 if(side===directionTarget){score++;play('pop',{pan:panFor(side),volume:.8})}else{play('beep',{rate:.55,volume:.8});}
 directionRound++;scoreText.textContent='Correct: '+score+' of 10';
 if(directionRound>=10){complete('Direction dash complete. You got '+score+' out of 10.');return;}
 setTimeout(cueDirection,500);
}
function scanner(){
 if(!ctx)return;
 if(target&&target.x!==undefined){const d=Math.abs(target.x-position);play('beep',{pan:panFor(target.x),rate:target.high?1.45:.9,volume:d===0?1:.65});}
 else play('beep',{rate:.8,volume:.5});
}
function centreAction(kind){
 if(currentMode==='hub'){if(kind==='double')spin();return}
 if(currentMode==='timing'&&kind==='single'){timingTap();return}
 if(currentMode==='jump')return;
 if(kind==='single')attemptPop(false);
 if(kind==='double')attemptPop(true);
}
function tapHandler(e){
 if(e.target===startButton||e.target.closest('#controls')||e.target===exitButton)return;
 if(!ctx)return;
 const x=e.clientX/window.innerWidth;const now=Date.now();
 const side=x<.33?0:x>.67?2:1;
 if(currentMode==='memory'){memoryTap(side);return}
 if(currentMode==='direction'){directionTap(side);return}
 if(x<.33&&currentMode!=='hub'){move(-1);return}
 if(x>.67&&currentMode!=='hub'){move(1);return}
 if(now-lastTap<330){clearTimeout(pendingTap);pendingTap=null;lastTap=0;centreAction('double')}
 else{lastTap=now;pendingTap=setTimeout(()=>{centreAction('single');pendingTap=null},340)}
}
document.addEventListener('pointerup',tapHandler);
document.addEventListener('touchstart',e=>{
 if(e.touches.length===2){
   e.preventDefault();
   const now=Date.now();
   if(now-lastTwoFingerTap<500){
     lastTwoFingerTap=0;
     repeatInstructions();
   }else{
     lastTwoFingerTap=now;
     setTimeout(()=>{
       if(lastTwoFingerTap===now){
         lastTwoFingerTap=0;
         scanner();
       }
     },520);
   }
 }
},{passive:false});
let holdTimer=null,secondDown=false;
document.addEventListener('pointerdown',e=>{
 if(currentMode!=='jump')return;
 const now=Date.now();
 if(now-lastTap<350){secondDown=true;chargeStart=Date.now();holdTimer=setTimeout(()=>{play('beep',{rate:1.2,volume:.45})},500)}
});
document.addEventListener('pointerup',()=>{if(currentMode==='jump'&&secondDown){secondDown=false;clearTimeout(holdTimer);finishChargedJump()}});
el('scanButton').addEventListener('click',e=>{e.stopPropagation();scanner()});
el('homeButton').addEventListener('click',e=>{e.stopPropagation();hub()});
exitButton.addEventListener('click',e=>{e.stopPropagation();hub()});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
